name: Suggest a company
description: A startup or tech company hiring in India that's missing from the list
title: "Add: "
labels: ["add-company"]
body:
  - type: input
    id: name
    attributes:
      label: Company name
    validations:
      required: true
  - type: input
    id: careers
    attributes:
      label: Careers page link
      description: Their jobs page (Greenhouse, Lever, Ashby, Keka, Workable, Zoho Recruit, their own site...)
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: City or cities in India
